[project]
name = "automate-this-backend"
version = "0.1.0"
description = "SMB automation advisor — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "openai>=2.44.0",
    "beautifulsoup4>=4.15.0",
    "tiktoken>=0.13.0",
    "httpx>=0.28.1",
    "fastmcp>=2.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live Postgres with pgvector (docker compose up -d postgres)",
]
