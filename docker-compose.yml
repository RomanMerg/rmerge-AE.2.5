services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automate}
      POSTGRES_DB: ${POSTGRES_DB:-automate_this}
    ports:
      # Host port 5433: 5432 is typically held by another local Postgres (e.g. the
      # Twenty CRM stack's twenty-db-1). Point DATABASE_URL at localhost:5433 to use
      # this container, or at your existing 5432 server with a dedicated database.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automate} -d ${POSTGRES_DB:-automate_this}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama intentionally omitted — use the existing host ollama container at localhost:11434

volumes:
  postgres_data:
